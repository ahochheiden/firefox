---
task-defaults:
    index:
        product: firefox
    treeherder:
        tier: 3
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 7200
    run-on-projects: []
    mozconfig:
        app: mobile/ios/appservices
        variant: opt
    run:
        using: mozharness
        actions: [build]
        script: "mozharness/scripts/fx_desktop_build.py"
        config:
            - builds/releng_base_firefox.py
        extra-config:
            disable_package_metrics: true
            upload_env: {"UPLOAD_PATH": "/builds/worker/artifacts"}
    use-sccache: true
    fetches:
        toolchain:
            - linux64-cctools-port
            - linux64-clang
            - linux64-rust-ios
            - linux64-cbindgen
            - linux64-sccache
            - sysroot-x86_64-linux-gnu

ios-appservices/opt:
    description: "ios application-services opt"
    index:
        job-name: ios-appservices-opt
    treeherder:
        platform: ios/opt
        symbol: B-as
    worker:
        env:
            PERFHERDER_EXTRA_OPTIONS: ios-appservices
    mozconfig:
        platform: ios
    fetches:
        toolchain:
            - ios-sdk

ios-sim-appservices/opt:
    description: "ios-sim application-services opt"
    index:
        job-name: ios-sim-appservices-opt
    treeherder:
        platform: ios/opt
        symbol: Bsim-as
    worker:
        env:
            PERFHERDER_EXTRA_OPTIONS: ios-sim-appservices
    mozconfig:
        platform: ios-sim
    fetches:
        toolchain:
            - ios-sim-sdk
