---
loader: taskgraph.loader.transform:loader

kind-dependencies:
    - artifact-build
    - build
    - l10n
    - l10n-staging
    - toolchain

transforms:
    - gecko_taskgraph.transforms.diffoscope:transforms
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

# Note: --exclude-command .--line-numbers is because of
# https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=879003
# That skips `objdump --disassemble --line-numbers` and falls back to
# `objdump --disassemble`
# Note: the .chk excludes are for files that are known to differ between
# builds because they are signed with an ephemeral private key that is
# generated for each build.
task-defaults:
    run-on-repo-type: [hg]
    tier: 2
    args: >-
        --output-empty
        --no-default-limits
        --max-page-size 100000000
        --max-page-diff-block-lines 10000
        --exclude-directory-metadata=yes
        --exclude-command .--line-numbers

tasks-from:
    - artifacts.yml
    - reproducible.yml

# Make a task for each diff we might want. The following are just examples,
# Both original and new can point to builds from the full set of tasks or
# from other sets through an index-search. Other kinds than `build` can be
# compared (for example, static-analysis), provided you adjust the
# kind-dependencies above.
#
# The l10n-staging-vs-l10n-* entries below compare the legacy l10n path
# (gate-off, ``installers-<ab_cd>`` make recipe chain) against the
# locale-staging path (gate-on, in-process ``mach repackage-single-locales``)
# for the same try push. Each locale's ``target.tar.xz`` gets its own
# diffoscope task because one l10n task chunks multiple locales and
# diffoscope only handles a single artifact pair.
tasks:
    l10n-staging-vs-l10n-linux64-ar:
        symbol: Lar
        new: l10n-staging-linux64/opt
        original: l10n-linux64/opt
        artifact: ar/target.tar.xz
    l10n-staging-vs-l10n-linux64-en-CA:
        symbol: LenCA
        new: l10n-staging-linux64/opt
        original: l10n-linux64/opt
        artifact: en-CA/target.tar.xz
    l10n-staging-vs-l10n-linux64-he:
        symbol: Lhe
        new: l10n-staging-linux64/opt
        original: l10n-linux64/opt
        artifact: he/target.tar.xz
    l10n-staging-vs-l10n-linux64-it:
        symbol: Lit
        new: l10n-staging-linux64/opt
        original: l10n-linux64/opt
        artifact: it/target.tar.xz
    l10n-staging-vs-l10n-linux64-ja:
        symbol: Lja
        new: l10n-staging-linux64/opt
        original: l10n-linux64/opt
        artifact: ja/target.tar.xz
